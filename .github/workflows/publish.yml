# Renders every month folder and publishes site/ to GitHub Pages on every push to main,
# including saves from the page's web edit mode (?edit=1), which commit content.md directly.
name: Render and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every issue and version (web, PDF, share, email)
        run: |
          while IFS= read -r d; do
            ./render.sh "$d"
          done < <(python3 issue_dirs.py)
      - name: Stage the website folder
        run: ./stage.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
